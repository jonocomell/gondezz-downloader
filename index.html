<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GONDEZZ DOWNLOADER</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #0d0d0d, #1a1a2e);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 420px;
            width: 100%;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 30px 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.08);
        }
        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #ff2d55, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }
        .sub {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 5px;
            font-weight: 600;
        }
        input, select {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }
        input:focus, select:focus {
            border-color: #ff2d55;
            background: rgba(255,45,85,0.1);
        }
        select option {
            background: #1a1a2e;
            color: #fff;
        }
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #ff2d55, #ff6b35);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            letter-spacing: 0.5px;
        }
        button:active {
            transform: scale(0.97);
            opacity: 0.8;
        }
        #status {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 14px;
            font-size: 14px;
            text-align: center;
            min-height: 60px;
            word-break: break-all;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .success {
            color: #4ade80;
        }
        .error {
            color: #f87171;
        }
        .loading {
            color: #fbbf24;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            color: #555;
        }
        .badge {
            display: inline-block;
            background: rgba(255,45,85,0.2);
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 11px;
            color: #ff2d55;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⬇️ GONDEZZ</h1>
        <div class="sub">ALL-IN-ONE DOWNLOADER</div>
        
        <div class="input-group">
            <label>📎 Link</label>
            <input type="text" id="urlInput" placeholder="Paste link YouTube/TikTok/Instagram...">
        </div>
        
        <div class="input-group">
            <label>🎯 Format</label>
            <select id="formatSelect">
                <option value="mp4">🎬 MP4 (Video)</option>
                <option value="mp3">🎵 MP3 (Audio)</option>
            </select>
        </div>
        
        <button onclick="downloadMedia()">⬇️ DOWNLOAD NOW</button>
        
        <div id="status">✨ Siap download...</div>
        <div class="badge">🔥 v2.0 | Only Android</div>
        <div class="footer">© 2026 Gondezz Studio</div>
    </div>

    <script>
        function downloadMedia() {
            const url = document.getElementById('urlInput').value.trim();
            const format = document.getElementById('formatSelect').value;
            const status = document.getElementById('status');

            if (!url) {
                status.innerHTML = '❌ Masukkan link dulu, Tuan!';
                status.className = 'error';
                return;
            }

            status.innerHTML = '⏳ Memproses download...';
            status.className = 'loading';

            // Kirim ke backend
            fetch('http://localhost:5000/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url, format: format })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    status.innerHTML = `✅ ${data.message} <br> 📁 ${data.filename}`;
                    status.className = 'success';
                    
                    // Auto download
                    window.location.href = `http://localhost:5000/download-file/${data.filename}`;
                } else {
                    status.innerHTML = `❌ Error: ${data.message}`;
                    status.className = 'error';
                }
            })
            .catch(err => {
                status.innerHTML = `❌ Gagal konek ke server: ${err.message}`;
                status.className = 'error';
            });
        }
    </script>
</body>
</html>
